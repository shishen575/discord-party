# 固定ドメインで使う場合 (名前付きトンネル)
#   cloudflared tunnel login
#   cloudflared tunnel create discord-party
#   cloudflared tunnel route dns discord-party party.example.com
#   cloudflared tunnel --config cloudflared/config.yml run discord-party
tunnel: discord-party
credentials-file: /path/to/<TUNNEL_ID>.json

ingress:
  # 本番: ビルド済みフロント+WebSocketを配信する Node サーバー
  # (Pterodactyl の場合は割り当てポートに合わせる)
  - hostname: party.example.com
    service: http://localhost:3001
  - service: http_status:404
